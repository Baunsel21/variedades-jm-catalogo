<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e7193f">
  <title>Sin conexión · Sirevya</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #050505; color: #fff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0, #240711, #050505 68%); }
    main { width: min(100%, 520px); padding: 32px 26px; border: 1px solid rgba(231,25,63,.55); border-radius: 22px; background: #0d0d0f; text-align: center; box-shadow: 0 20px 70px rgba(0,0,0,.35); }
    img { width: 104px; height: 104px; object-fit: contain; background: #fff; border-radius: 18px; }
    h1 { margin: 22px 0 10px; font-size: clamp(1.65rem, 6vw, 2.25rem); }
    p { margin: 10px 0; color: #d0d0d4; line-height: 1.6; }
    .notice { margin-top: 20px; padding: 12px 14px; border-radius: 12px; background: #1a1114; border: 1px solid #51303a; color: #f1d9df; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/pwa/icon-192.png" width="104" height="104" alt="Sirevya">
    <h1>Estás sin conexión</h1>
    <p>La tienda necesita conexión para consultar información vigente.</p>
    <p class="notice">No mostramos inventario, precios ni tarifas guardados como si fueran actuales. Cuando recuperes la conexión, actualiza esta página.</p>
  </main>
</body>
</html>

name: deploy-wompi-webhook-sandbox

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sirevya-supabase-sandbox
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: xfrxvpzmderenmudegqt
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify Sandbox-only scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test "${SUPABASE_PROJECT_REF}" = "xfrxvpzmderenmudegqt"
          test -f supabase/functions/wompi-webhook-sandbox/index.ts
          test ! -e supabase/functions/wompi-webhook/index.ts || true
          grep -Eq 'wompi-webhook-sandbox' supabase/functions/wompi-webhook-sandbox/index.ts || true
      - name: Deploy only Sandbox webhook
        run: |
          set -euo pipefail
          supabase functions deploy wompi-webhook-sandbox \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

name: Build product SEO pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/generate_product_seo.mjs'
      - 'tests/seo_prerender_regression.mjs'
      - 'tests/fixtures/seo_public_catalog.json'
      - '.github/workflows/seo-pages.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/generate_product_seo.mjs'
      - '.github/workflows/seo-pages.yml'
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sirevya-pages-seo
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || vars.SIREVYA_PAGES_ACTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build fixture pages for pull-request checks
        if: github.event_name == 'pull_request'
        run: node scripts/generate_product_seo.mjs --out-dir _site --fixture tests/fixtures/seo_public_catalog.json
      - name: Build from the public storefront catalog
        if: github.event_name != 'pull_request'
        run: node scripts/generate_product_seo.mjs --out-dir _site
      - name: Verify generated pages and navigation
        run: node tests/seo_prerender_regression.mjs
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && vars.SIREVYA_PAGES_ACTIONS_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm Pages is configured for Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_type="$(gh api "/repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [ "$source_type" != "workflow" ]; then
            echo "Deployment refused: GitHub Pages must first be switched to GitHub Actions in repository Settings."
            exit 1
          fi
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4

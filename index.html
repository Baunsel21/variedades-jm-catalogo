<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Variedades JM • Catálogo</title>
<meta name="description" content="Catálogo de productos de Variedades JM">
<link id="favicon" rel="icon" href="">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7fb;--surface:#fff;--text:#171923;--muted:#6f7688;--primary:#2457e6;--primary2:#173da8;--border:#e7e9f0;--success:#159447;--shadow:0 12px 35px rgba(21,28,48,.09);--radius:20px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}button,input,select,a{font:inherit}button{cursor:pointer;border:0}a{text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:0 18px}.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}.topin{height:78px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.brandLogo{width:54px;height:54px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#101827;flex:none}.brandLogo img{width:100%;height:100%;object-fit:contain;border-radius:50%}.brandName{font-weight:900;font-size:20px}.brandSub{font-size:12px;color:var(--muted);margin-top:2px}.waBtns{display:flex;gap:8px;align-items:center}.waTop{background:#168c4b;color:#fff;padding:11px 16px;border-radius:13px;font-weight:800}.hero{margin:26px 0 20px;background:linear-gradient(135deg,#0e1d3b,#2457e6);color:#fff;border-radius:28px;padding:30px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-100px;top:-120px;background:rgba(255,255,255,.08)}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}.hero p{margin:0;color:#dce5ff;font-size:16px;max-width:650px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:220px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 15px;outline:none}.search:focus{border-color:#9ab0ff;box-shadow:0 0 0 4px rgba(36,87,230,.09)}select{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 15px;min-width:170px}.count{color:var(--muted);font-size:14px;margin-left:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding-bottom:45px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 7px 24px rgba(30,36,55,.06);display:flex;flex-direction:column;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.photo{aspect-ratio:1/1;background:#f0f2f7;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:contain;display:block}.photoNav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.photoBtn{pointer-events:auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);color:#111827;font-size:20px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.15);margin:0 8px}.photoDots{position:absolute;bottom:9px;left:0;right:0;display:flex;justify-content:center;gap:5px}.photoDot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.15)}.photoDot.active{background:#2457e6}.photoCount{position:absolute;left:10px;top:10px;background:rgba(17,24,39,.75);color:#fff;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.noimg{font-size:42px;color:#9aa1b2}.stock{position:absolute;top:10px;right:10px;background:#fff;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.12)}.stock.ok{color:var(--success)}.stock.out{color:#d13b43}.body{padding:15px}.code{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.5px}.name{font-size:17px;font-weight:900;margin:5px 0}.cat{font-size:12px;color:var(--muted)}.price{font-size:22px;font-weight:950;margin-top:12px}.buyRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.buy{width:100%;padding:12px;border-radius:13px;background:#168c4b;color:#fff;font-weight:900}.buy:disabled{background:#c9ced8;cursor:not-allowed}.empty,.loading{padding:50px;text-align:center;color:var(--muted);grid-column:1/-1;background:#fff;border:1px dashed var(--border);border-radius:18px}.footer{border-top:1px solid var(--border);padding:25px 0 40px;color:var(--muted);font-size:13px;text-align:center}.error{display:none;background:#fff1f1;color:#a32730;border:1px solid #ffd0d0;border-radius:15px;padding:14px;margin:15px 0}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 17px;border-radius:12px;display:none;z-index:50}@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:680px){.topin{height:70px}.brandLogo{width:46px;height:46px}.brandName{font-size:17px}.brandSub{font-size:11px}.waBtns{gap:6px}.waTop{padding:9px 10px;font-size:12px}.hero{padding:23px;border-radius:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.body{padding:12px}.name{font-size:15px}.price{font-size:19px}.buy{padding:10px 6px;font-size:12px}.toolbar{align-items:stretch}.search{min-width:100%;}.count{margin-left:0;width:100%}}@media(max-width:390px){.grid{grid-template-columns:1fr}.waBtns{display:none}}

.galleryModal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.galleryModal.open{display:flex}
.galleryBox{position:relative;width:min(96vw,1000px);height:min(92vh,850px);display:flex;align-items:center;justify-content:center}
.galleryMain{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;box-shadow:0 10px 50px rgba(0,0,0,.45)}
.galleryClose{position:absolute;right:0;top:-8px;width:46px;height:46px;border:0;border-radius:50%;background:#fff;color:#111;font-size:30px;line-height:1;cursor:pointer;z-index:3}
.galleryNav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#111;font-size:36px;line-height:1;cursor:pointer;z-index:3}
.galleryPrev{left:8px}.galleryNext{right:8px}
.galleryInfo{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.62);color:#fff;padding:7px 13px;border-radius:999px;font-size:13px;z-index:3}
.card,.photo{cursor:pointer}
@media(max-width:680px){.galleryModal{padding:8px}.galleryBox{width:100vw;height:90vh}.galleryNav{width:44px;height:44px;font-size:30px}.galleryPrev{left:3px}.galleryNext{right:3px}.galleryClose{right:3px;top:0;width:42px;height:42px}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin"><div class="brand"><div class="brandLogo"><img id="brandLogo" alt="Variedades JM"></div><div><div class="brandName">Variedades JM</div><div class="brandSub">Catálogo de productos</div></div></div><div class="waBtns"><button class="waTop" onclick="openWhatsApp('Hola, quiero información sobre sus productos.',WHATSAPP_NUMBERS[0])">💬 WhatsApp 1</button><button class="waTop" onclick="openWhatsApp('Hola, quiero información sobre sus productos.',WHATSAPP_NUMBERS[1])">💬 WhatsApp 2</button></div></div></header>
<main class="wrap">
<section class="hero"><h1>Catálogo Variedades JM</h1><p>Conoce nuestros productos disponibles. Elige el que te guste y escríbenos directamente por WhatsApp.</p></section>
<div id="error" class="error"></div>
<div class="toolbar"><input id="search" class="search" placeholder="🔎 Buscar producto, código o categoría" oninput="render()"><select id="category" onchange="render()"><option value="">Todas las categorías</option></select><select id="availability" onchange="render()"><option value="">Disponibilidad</option><option value="available">Disponibles</option><option value="out">Agotados</option></select><span id="count" class="count">Cargando...</span></div>
<section id="grid" class="grid"><div class="loading">Cargando catálogo...</div></section>
</main>
<footer class="footer"><div class="wrap">Variedades JM · Catálogo actualizado desde el inventario</div></footer>
<div id="galleryModal" class="galleryModal" onclick="closeGallery(event)"><div class="galleryBox"><button class="galleryClose" type="button" onclick="closeGallery()">×</button><button id="galleryPrev" class="galleryNav galleryPrev" type="button" onclick="galleryMove(-1,event)">‹</button><img id="galleryMain" class="galleryMain" alt="Imagen del producto"><button id="galleryNext" class="galleryNav galleryNext" type="button" onclick="galleryMove(1,event)">›</button><div id="galleryInfo" class="galleryInfo"></div></div></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL="https://hnlbbtnfmbnbkcgegufa.supabase.co";
const SUPABASE_KEY="sb_publishable_p2XJjsFd4Hp7LZ1IgfyVAg_hpXnFSSc";
// Pon aquí el número de WhatsApp de Variedades JM, con código de país y sin + ni espacios.
const WHATSAPP_NUMBERS=["573128561773","573025469983"];
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let productos=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0);
function openWhatsApp(text,number){const n=String(number||'').replace(/\D/g,'');if(!n){showToast('Número de WhatsApp no configurado.');return}const url='https://wa.me/'+n+'?text='+encodeURIComponent(text);window.location.assign(url)}
function pedirProducto(text,number,event){if(event){event.preventDefault();event.stopPropagation()}openWhatsApp(text,number)}
function showToast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
function publicImage(path){if(!path)return '';let p=String(path);if(p.includes('/product-images/'))p=p.split('/product-images/')[1];p=p.split('?')[0].replace(/^\//,'');try{p=decodeURIComponent(p)}catch{}return SUPABASE_URL+'/storage/v1/object/public/product-images/'+p}
function productImages(p){const a=Array.isArray(p.image_paths)?p.image_paths.filter(Boolean):[];if(!a.length&&p.image_url)a.push(p.image_url);return a.map(publicImage).filter(Boolean)}
function changePhoto(i,d,event){if(event){event.preventDefault();event.stopPropagation()}const p=productos.find(x=>String(x.id)===String(i));if(!p)return;const imgs=productImages(p);if(imgs.length<2)return;const key='photo_'+i;let n=Number(document.querySelector('[data-photo="'+CSS.escape(key)+'"]')?.dataset.index||0);n=(n+d+imgs.length)%imgs.length;const el=document.querySelector('[data-photo="'+CSS.escape(key)+'"]');if(!el)return;el.dataset.index=n;el.querySelector('img').src=imgs[n];el.querySelectorAll('.photoDot').forEach((x,j)=>x.classList.toggle('active',j===n));}
function openGallery(id,event){if(event){event.preventDefault();event.stopPropagation()}const p=productos.find(x=>String(x.id)===String(id));if(!p)return;const imgs=productImages(p);if(!imgs.length)return;galleryProduct=p;galleryIndex=0;galleryImages=imgs;renderGallery();$('galleryModal').classList.add('open');document.body.style.overflow='hidden'}
let galleryProduct=null,galleryImages=[],galleryIndex=0;
function renderGallery(){if(!galleryImages.length)return;$('galleryMain').src=galleryImages[galleryIndex];$('galleryMain').alt=galleryProduct?.name||'Producto';$('galleryInfo').textContent=(galleryIndex+1)+' / '+galleryImages.length;const multi=galleryImages.length>1;$('galleryPrev').style.display=multi?'block':'none';$('galleryNext').style.display=multi?'block':'none'}
function galleryMove(d,event){if(event){event.preventDefault();event.stopPropagation()}if(galleryImages.length<2)return;galleryIndex=(galleryIndex+d+galleryImages.length)%galleryImages.length;renderGallery()}
function closeGallery(event){if(event&&event.target!==$('galleryModal'))return;$('galleryModal').classList.remove('open');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(!$('galleryModal')?.classList.contains('open'))return;if(e.key==='Escape')closeGallery();if(e.key==='ArrowLeft')galleryMove(-1);if(e.key==='ArrowRight')galleryMove(1)});
function render(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value,av=$('availability').value;const arr=productos.filter(p=>{const text=(p.code+' '+p.name+' '+p.category).toLowerCase();const ok=Number(p.quantity)>0;return text.includes(q)&&(!cat||p.category===cat)&&(!av||(av==='available'&&ok)||(av==='out'&&!ok))});$('count').textContent=arr.length+' producto'+(arr.length===1?'':'s');$('grid').innerHTML=arr.length?arr.map(p=>{const imgs=productImages(p),ok=Number(p.quantity)>0,msg='Hola, me interesa el producto '+p.code+' - '+p.name+' por '+money(p.sale_price)+'. ¿Está disponible?';const key='photo_'+p.id;return `<article class="card" onclick="openGallery('${esc(p.id)}',event)"><div class="photo" data-photo="${esc(key)}" data-index="0">${imgs.length?`<img src="${esc(imgs[0])}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">${imgs.length>1?`<div class="photoNav"><button class="photoBtn" type="button" onclick="changePhoto('${esc(p.id)}',-1,event)">‹</button><button class="photoBtn" type="button" onclick="changePhoto('${esc(p.id)}',1,event)">›</button></div><span class="photoCount">📷 ${imgs.length}</span><div class="photoDots">${imgs.map((_,j)=>`<span class="photoDot ${j===0?'active':''}"></span>`).join('')}</div>`:''}`:'<div class="noimg">📦</div>'}<span class="stock ${ok?'ok':'out'}">${ok?'✓ '+p.quantity+' disponible'+(Number(p.quantity)===1?'':'s'):'Agotado'}</span></div><div class="body"><div class="code">${esc(p.code)}</div><div class="name">${esc(p.name)}</div><div class="cat">${esc(p.category||'Producto')}</div><div class="price">${money(p.sale_price)}</div><div class="buyRow">${ok?`<a class="buy" href="https://wa.me/${WHATSAPP_NUMBERS[0]}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">💬 WhatsApp 1</a><a class="buy" href="https://wa.me/${WHATSAPP_NUMBERS[1]}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">💬 WhatsApp 2</a>`:'<button type="button" class="buy" disabled>Agotado</button><button type="button" class="buy" disabled>Agotado</button>'}</div></div></article>`}).join(''):'<div class="empty">No encontramos productos con esos filtros.</div>'}
async function load(){try{const {data,error}=await sb.rpc('get_public_catalog_multifotos');if(error)throw error;productos=(data||[]).map(p=>({...p,quantity:Number(p.quantity)||0}));const cats=[...new Set(productos.map(p=>p.category).filter(Boolean))].sort();$('category').innerHTML='<option value="">Todas las categorías</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');render();}catch(e){console.error(e);$('error').style.display='block';$('error').textContent='No se pudo cargar el catálogo todavía. Falta activar la función pública en Supabase. Te entrego el SQL para activarla junto con este archivo.';$('grid').innerHTML=''} }
load();
</script>
</body></html>

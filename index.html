<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Variedades JM • Catálogo</title>
<meta name="description" content="Catálogo de productos de Variedades JM">
<link id="favicon" rel="icon" href="">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7fb;--surface:#fff;--text:#171923;--muted:#6f7688;--primary:#2457e6;--primary2:#173da8;--border:#e7e9f0;--success:#159447;--shadow:0 12px 35px rgba(21,28,48,.09);--radius:20px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1200px;margin:auto;padding:0 18px}.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}.topin{height:78px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.brandLogo{width:54px;height:54px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#101827;flex:none}.brandLogo img{width:100%;height:100%;object-fit:contain;border-radius:50%}.brandName{font-weight:900;font-size:20px}.brandSub{font-size:12px;color:var(--muted);margin-top:2px}.waTop{background:#168c4b;color:#fff;padding:11px 16px;border-radius:13px;font-weight:800}.hero{margin:26px 0 20px;background:linear-gradient(135deg,#0e1d3b,#2457e6);color:#fff;border-radius:28px;padding:30px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-100px;top:-120px;background:rgba(255,255,255,.08)}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}.hero p{margin:0;color:#dce5ff;font-size:16px;max-width:650px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:220px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 15px;outline:none}.search:focus{border-color:#9ab0ff;box-shadow:0 0 0 4px rgba(36,87,230,.09)}select{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 15px;min-width:170px}.count{color:var(--muted);font-size:14px;margin-left:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding-bottom:45px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 7px 24px rgba(30,36,55,.06);display:flex;flex-direction:column;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.photo{aspect-ratio:1/1;background:#f0f2f7;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:contain;display:block}.noimg{font-size:42px;color:#9aa1b2}.stock{position:absolute;top:10px;right:10px;background:#fff;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.12)}.stock.ok{color:var(--success)}.stock.out{color:#d13b43}.body{padding:15px}.code{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.5px}.name{font-size:17px;font-weight:900;margin:5px 0}.cat{font-size:12px;color:var(--muted)}.price{font-size:22px;font-weight:950;margin-top:12px}.buy{width:100%;margin-top:12px;padding:12px;border-radius:13px;background:#168c4b;color:#fff;font-weight:900}.buy:disabled{background:#c9ced8;cursor:not-allowed}.empty,.loading{padding:50px;text-align:center;color:var(--muted);grid-column:1/-1;background:#fff;border:1px dashed var(--border);border-radius:18px}.footer{border-top:1px solid var(--border);padding:25px 0 40px;color:var(--muted);font-size:13px;text-align:center}.error{display:none;background:#fff1f1;color:#a32730;border:1px solid #ffd0d0;border-radius:15px;padding:14px;margin:15px 0}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 17px;border-radius:12px;display:none;z-index:50}@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:680px){.topin{height:70px}.brandLogo{width:46px;height:46px}.brandName{font-size:17px}.brandSub{font-size:11px}.waTop{padding:9px 11px;font-size:12px}.hero{padding:23px;border-radius:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.body{padding:12px}.name{font-size:15px}.price{font-size:19px}.buy{padding:10px;font-size:13px}.toolbar{align-items:stretch}.search{min-width:100%;}.count{margin-left:0;width:100%}}@media(max-width:390px){.grid{grid-template-columns:1fr}.waTop{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin"><div class="brand"><div class="brandLogo"><img id="brandLogo" alt="Variedades JM"></div><div><div class="brandName">Variedades JM</div><div class="brandSub">Catálogo de productos</div></div></div><button class="waTop" onclick="openWhatsApp('Hola, quiero información sobre sus productos.')">💬 WhatsApp</button></div></header>
<main class="wrap">
<section class="hero"><h1>Catálogo Variedades JM</h1><p>Conoce nuestros productos disponibles. Elige el que te guste y escríbenos directamente por WhatsApp.</p></section>
<div id="error" class="error"></div>
<div class="toolbar"><input id="search" class="search" placeholder="🔎 Buscar producto, código o categoría" oninput="render()"><select id="category" onchange="render()"><option value="">Todas las categorías</option></select><select id="availability" onchange="render()"><option value="">Disponibilidad</option><option value="available">Disponibles</option><option value="out">Agotados</option></select><span id="count" class="count">Cargando...</span></div>
<section id="grid" class="grid"><div class="loading">Cargando catálogo...</div></section>
</main>
<footer class="footer"><div class="wrap">Variedades JM · Catálogo actualizado desde el inventario</div></footer>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL="https://hnlbbtnfmbnbkcgegufa.supabase.co";
const SUPABASE_KEY="sb_publishable_p2XJjsFd4Hp7LZ1IgfyVAg_hpXnFSSc";
// Pon aquí el número de WhatsApp de Variedades JM, con código de país y sin + ni espacios.
const WHATSAPP_NUMBER="573000000000";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let productos=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0);
function openWhatsApp(text){const n=WHATSAPP_NUMBER.replace(/\D/g,'');if(!n||n==='573000000000'){showToast('Configura tu número de WhatsApp en el archivo del catálogo.');return}location.href='https://wa.me/'+n+'?text='+encodeURIComponent(text)}
function showToast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
function publicImage(path){if(!path)return '';let p=String(path);if(p.includes('/product-images/'))p=p.split('/product-images/')[1];p=p.split('?')[0].replace(/^\//,'');try{p=decodeURIComponent(p)}catch{}return SUPABASE_URL+'/storage/v1/object/public/product-images/'+p}
function render(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value,av=$('availability').value;const arr=productos.filter(p=>{const text=(p.code+' '+p.name+' '+p.category).toLowerCase();const ok=Number(p.quantity)>0;return text.includes(q)&&(!cat||p.category===cat)&&(!av||(av==='available'&&ok)||(av==='out'&&!ok))});$('count').textContent=arr.length+' producto'+(arr.length===1?'':'s');$('grid').innerHTML=arr.length?arr.map(p=>{const img=publicImage(p.image_url);const ok=Number(p.quantity)>0;const msg='Hola, me interesa el producto '+p.code+' - '+p.name+' por '+money(p.sale_price)+'. ¿Está disponible?';return `<article class="card"><div class="photo">${img?`<img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">`:'<div class="noimg">📦</div>'}<span class="stock ${ok?'ok':'out'}">${ok?'✓ '+p.quantity+' disponible'+(Number(p.quantity)===1?'':'s'):'Agotado'}</span></div><div class="body"><div class="code">${esc(p.code)}</div><div class="name">${esc(p.name)}</div><div class="cat">${esc(p.category||'Producto')}</div><div class="price">${money(p.sale_price)}</div><button class="buy" ${ok?'':'disabled'} onclick="openWhatsApp(${JSON.stringify(msg)})">${ok?'💬 Pedir por WhatsApp':'Agotado'}</button></div></article>`}).join(''):'<div class="empty">No encontramos productos con esos filtros.</div>'}
async function load(){try{const {data,error}=await sb.rpc('get_public_catalog');if(error)throw error;productos=(data||[]).map(p=>({...p,quantity:Number(p.quantity)||0}));const cats=[...new Set(productos.map(p=>p.category).filter(Boolean))].sort();$('category').innerHTML='<option value="">Todas las categorías</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');render();}catch(e){console.error(e);$('error').style.display='block';$('error').textContent='No se pudo cargar el catálogo todavía. Falta activar la función pública en Supabase. Te entrego el SQL para activarla junto con este archivo.';$('grid').innerHTML=''} }
load();
</script>
</body></html>
